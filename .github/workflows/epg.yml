name: EPG

# Rebuilds epg.xml every 6 hours and commits it when it changed, so the raw URL stays current.
# GitHub cron is UTC: 06:30 UTC = 07:30 in Rome during CET, 08:30 during CEST.
on:
  schedule: [{ cron: "30 */6 * * *" }]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  epg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -t .
      - run: python build_epg.py -o epg.xml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epg.xml
          git diff --cached --quiet || git commit -m "Update epg.xml"
          git push
